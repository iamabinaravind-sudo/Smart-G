<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SmartG Electronics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold fs-3 text-primary" href="index.html">
                <i class="bi bi-phone-fill me-1"></i>SmartG
            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">Cart</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="login.html">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= LOGIN FORM ================= -->

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="card shadow border-0">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="bi bi-person-circle text-primary"
                                style="font-size:70px;"></i>

                            <h2 class="fw-bold mt-3">
                                Login
                            </h2>

                            <p class="text-muted">
                                Sign in to your SmartG account
                            </p>

                        </div>

                        <form>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Enter your password">

                            </div>

                            <div class="d-flex justify-content-between mb-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox">

                                    <label class="form-check-label">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="#" class="text-decoration-none">

                                    Forgot Password?

                                </a>

                            </div>

                            <button
                                class="btn btn-primary w-100">

                                Login

                            </button>

                        </form>

                        <hr>

                        <p class="text-center mb-0">

                            Don't have an account?

                            <a href="register.html"
                                class="text-decoration-none">

                                Register

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white py-4">

        <div class="container text-center">

            <p class="mb-2">

                SmartG Electronics

            </p>

            <small>

                © 2026 SmartG Electronics. All Rights Reserved.

            </small>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
