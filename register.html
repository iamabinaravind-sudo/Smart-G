<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SmartG Electronics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

        <div class="container">

            <a class="navbar-brand fw-bold fs-3 text-primary" href="index.html">
                <i class="bi bi-phone-fill me-1"></i>SmartG
            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">Cart</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= PAGE HEADER ================= -->

    <section class="bg-primary text-white py-5">

        <div class="container text-center">

            <h1 class="fw-bold">
                Create Your Account
            </h1>

            <p class="mb-0">
                Join SmartG and enjoy the latest electronics offers.
            </p>

        </div>

    </section>

    <!-- ================= REGISTER FORM ================= -->

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card border-0 shadow">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="bi bi-person-plus-fill text-primary"
                                style="font-size:70px;"></i>

                            <h2 class="fw-bold mt-3">
                                Register
                            </h2>

                        </div>

                        <form>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Enter first name">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Enter last name">

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter mobile number">

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Create password">

                                </div>

                                <div class="col-md-6 mb-4">

                                    <label class="form-label">
                                        Confirm Password
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Confirm password">

                                </div>

                            </div>

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms">

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the Terms & Conditions

                                </label>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Create Account

                            </button>

                        </form>

                        <hr>

                        <p class="text-center mb-0">

                            Already have an account?

                            <a href="login.html"
                                class="text-decoration-none">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white py-4">

        <div class="container text-center">

            <h5>
                SmartG Electronics
            </h5>

            <p class="mb-1">

                Your Trusted Electronics Store

            </p>

            <small>

                © 2026 SmartG Electronics. All Rights Reserved.

            </small>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
